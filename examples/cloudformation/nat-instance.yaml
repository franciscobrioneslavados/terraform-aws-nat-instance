# NAT Instance via AWS CloudFormation
# Mirrors the Terraform module (v1.5.0): SSM access (no SSH exposed), no Elastic IP.
#
# Deploy:
#   aws cloudformation create-stack \
#     --stack-name nat-instance \
#     --template-body file://nat-instance.yaml \
#     --parameters \
#       ParameterKey=VpcId,ParameterValue=vpc-xxxxxxxx \
#       ParameterKey=PublicSubnetId,ParameterValue=subnet-xxxxxxxx \
#       ParameterKey=PrivateSubnetCidr1,ParameterValue=10.0.1.0/24 \
#       ParameterKey=RouteTableId,ParameterValue=rtb-xxxxxxxx \
#       ParameterKey=ProjectName,ParameterValue=my-project \
#       ParameterKey=Environment,ParameterValue=dev \
#       ParameterKey=OwnerName,ParameterValue="Your Name"
#
# Connect (Session Manager, no SSH):
#   aws ssm start-session --target <InstanceId>
AWSTemplateFormatVersion: "2010-09-09"
Description: NAT Instance with SSM-only access (no SSH, no EIP)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the NAT Instance will be deployed
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet for the NAT Instance
  PrivateSubnetCidr1:
    Type: String
    AllowedPattern: "([0-9]{1,3}\\.){3}[0-9]{1,3}(/([0-9]|[1-2][0-9]|3[0-2]))?"
    Description: CIDR of private subnet 1 (traffic source for the NAT)
  PrivateSubnetCidr2:
    Type: String
    Default: ""
    Description: Optional CIDR of private subnet 2
  PrivateSubnetCidr3:
    Type: String
    Default: ""
    Description: Optional CIDR of private subnet 3
  RouteTableId:
    Type: String
    Description: Route table of the private subnets to update (0.0.0.0/0 -> NAT Instance)
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium, t4g.micro, t4g.small, t2.micro, t2.small]
    Description: EC2 instance type for the NAT Instance
  ProjectName:
    Type: String
    Description: Project name for tagging
  Environment:
    Type: String
    Description: Environment name for tagging (dev, staging, prod)
  OwnerName:
    Type: String
    Description: Owner name for tagging

Conditions:
  HasCidr2: !Not [!Equals [!Ref PrivateSubnetCidr2, ""]]
  HasCidr3: !Not [!Equals [!Ref PrivateSubnetCidr3, ""]]

Resources:
  # IAM role + instance profile for AWS Systems Manager (SSH-free access)
  NatInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ssm-${Environment}-${ProjectName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: OwnerName
          Value: !Ref OwnerName
        - Key: ProjectName
          Value: !Ref ProjectName

  NatInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "ssm-${Environment}-${ProjectName}"
      Roles:
        - !Ref NatInstanceRole

  # Security group: only traffic from private subnets in; all out
  NatSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the NAT Instance (SSM access, no SSH)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: !Ref PrivateSubnetCidr1
          Description: TCP from private subnet 1
        - IpProtocol: udp
          FromPort: 0
          ToPort: 65535
          CidrIp: !Ref PrivateSubnetCidr1
          Description: UDP from private subnet 1
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: !Ref PrivateSubnetCidr1
          Description: ICMP (ping / PMTUD) from private subnet 1
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${ProjectName}-nat-instance-sg"
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: OwnerName
          Value: !Ref OwnerName
        - Key: ProjectName
          Value: !Ref ProjectName

  # Extra ingress rules for optional private subnets
  NatIngressTcp2:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCidr2
    Properties:
      GroupId: !Ref NatSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      CidrIp: !Ref PrivateSubnetCidr2
  NatIngressUdp2:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCidr2
    Properties:
      GroupId: !Ref NatSecurityGroup
      IpProtocol: udp
      FromPort: 0
      ToPort: 65535
      CidrIp: !Ref PrivateSubnetCidr2
  NatIngressIcmp2:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCidr2
    Properties:
      GroupId: !Ref NatSecurityGroup
      IpProtocol: icmp
      FromPort: -1
      ToPort: -1
      CidrIp: !Ref PrivateSubnetCidr2
  NatIngressTcp3:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCidr3
    Properties:
      GroupId: !Ref NatSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      CidrIp: !Ref PrivateSubnetCidr3
  NatIngressUdp3:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCidr3
    Properties:
      GroupId: !Ref NatSecurityGroup
      IpProtocol: udp
      FromPort: 0
      ToPort: 65535
      CidrIp: !Ref PrivateSubnetCidr3
  NatIngressIcmp3:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCidr3
    Properties:
      GroupId: !Ref NatSecurityGroup
      IpProtocol: icmp
      FromPort: -1
      ToPort: -1
      CidrIp: !Ref PrivateSubnetCidr3

  # NAT Instance (latest Amazon Linux 2023, x86_64)
  NatInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds:
        - !Ref NatSecurityGroup
      IamInstanceProfile: !Ref NatInstanceProfile
      SourceDestCheck: false
      AssociatePublicIpAddress: true
      UserData: !Base64 |
        #!/bin/bash
        set -e

        dnf update -y

        # IP forwarding
        echo 'net.ipv4.ip_forward = 1' | tee -a /etc/sysctl.conf
        sysctl -p

        # iptables persistence
        dnf install -y iptables-services
        systemctl enable iptables
        systemctl start iptables

        # NAT masquerading (dynamic interface detection for Nitro/Graviton)
        PRIMARY_IFACE=$(ip route show | grep '^default' | awk '{print $5}')
        iptables -t nat -A POSTROUTING -o $PRIMARY_IFACE -j MASQUERADE
        iptables -A FORWARD -i $PRIMARY_IFACE -o $PRIMARY_IFACE -j ACCEPT
        iptables-save > /etc/sysconfig/iptables

        # Diagnostics + SSM agent (SSH-free access)
        dnf install -y tcpdump curl wget amazon-ssm-agent
        systemctl enable amazon-ssm-agent
        systemctl start amazon-ssm-agent

        echo "NAT Instance configured successfully"
      Tags:
        - Key: Name
          Value: !Sub "ec2-${Environment}-${ProjectName}"
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: OwnerName
          Value: !Ref OwnerName
        - Key: ProjectName
          Value: !Ref ProjectName

  # Route private subnets -> NAT Instance
  NatRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTableId
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref NatInstance

Outputs:
  NatInstanceId:
    Description: ID of the NAT Instance (target for SSM)
    Value: !Ref NatInstance
  NatInstancePrivateIp:
    Description: Private IP of the NAT Instance
    Value: !GetAtt NatInstance.PrivateIp
  NatInstancePublicIp:
    Description: Public IP of the NAT Instance (dynamic, changes on restart)
    Value: !GetAtt NatInstance.PublicIp
  NatSecurityGroupId:
    Description: Security Group ID of the NAT Instance
    Value: !Ref NatSecurityGroup
  SsmConnectCommand:
    Description: Command to connect via AWS Systems Manager (no SSH)
    Value: !Sub "aws ssm start-session --target ${NatInstance}"
